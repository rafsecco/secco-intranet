# Ambiente de desenvolvimento: SQL Server local.
#   cp .env.example .env    # uma vez por máquina, e troque as senhas
#   docker compose up -d
#
# Nenhuma credencial aqui: tudo vem do .env da raiz, que o Compose lê sozinho para
# interpolar este arquivo. O inventário das variáveis está em .env.example.
#
# sa existe só para o container subir e para o serviço sqlserver-init provisionar o banco
# do tenant — a aplicação NUNCA usa sa (ADR-0007). Depois do init, a connection string do
# tenant no .env aponta para o login de aplicação que o init cria, com db_owner só naquele
# banco. Ver docker/init/provision-tenant-db.sql.
#
# O serviço do monolito (Secco.Intranet.Web, ADR-0002) será adicionado quando o
# projeto existir; em Development ele aplicará migrations e seed nos tenants do catálogo.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Sem valor default de propósito: preferimos falhar a subida a subir um banco
      # com senha que qualquer um que leia o repositório conhece.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env (copie de .env.example)}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      # Sem isto, todo `docker compose up` que recria o container zera os bancos de
      # tenant. A app recria o schema no start (migrations + seed em Development), mas
      # os dados que você cadastrou navegando somem junto.
      # Para começar do zero de propósito: `docker compose down -v`.
      - mssql-data:/var/opt/mssql
    healthcheck:
      # $$ escapa a interpolação do Compose: quem expande é o shell DENTRO do container,
      # então a senha não aparece no YAML nem no comando registrado do healthcheck.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda uma vez, cria o banco do tenant "alfa" e o login de aplicação com db_owner só
  # nele, e sai (restart: "no"). sa fica confinado a este container efêmero — o processo
  # da aplicação nunca o vê. Reexecutar é seguro: o script é idempotente.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env (copie de .env.example)}"
      MSSQL_APP_PASSWORD: "${MSSQL_APP_PASSWORD:?defina MSSQL_APP_PASSWORD no .env (copie de .env.example)}"
    volumes:
      - ./docker/init/provision-tenant-db.sql:/init/provision-tenant-db.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -v AppPassword="$$MSSQL_APP_PASSWORD"
        -i /init/provision-tenant-db.sql
    restart: "no"

volumes:
  mssql-data:
